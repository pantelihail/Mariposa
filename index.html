<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<title>Mariposa · Catálogo</title>
<meta name="description" content="Catálogo de Mariposa: cocina y vajilla, hogar y ferretería. Mira lo que hay disponible, arma tu pedido y escríbenos por WhatsApp.">
<link rel="manifest" href="tienda.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/tienda.css">
</head>
<body>
<div class="banner" id="banner" role="status" hidden><div class="wrap" id="bannerText"></div></div>

<header class="head">
  <div class="wrap">
    <div class="topbar" id="topbar" hidden>
      <div class="pill-bar">
        <button class="nav-btn" id="whereBtn" type="button" aria-expanded="false" aria-controls="wherePop" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          <span id="placeLabel">Ubicación</span><span class="chev"></span>
        </button>
        <span class="sep" id="sep" aria-hidden="true" hidden></span>
        <button class="nav-btn" id="waBtn" type="button" aria-expanded="false" aria-controls="waPop" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span>WhatsApp</span><span class="chev"></span>
        </button>
      </div>
      <div class="pop" id="wherePop" hidden></div>
      <div class="pop" id="waPop" hidden></div>
    </div>
    <div class="brand">
      <svg viewBox="0 0 32 24" aria-hidden="true" focusable="false">
        <g fill="currentColor">
          <path d="M16 11 C11 1 1 2 3 10 C4 14 11 14 16 12 Z"/>
          <path d="M16 12.5 C11 13 5 16 7 21 C9 24 14 20 16 14.5 Z"/>
          <g transform="translate(32 0) scale(-1 1)">
            <path d="M16 11 C11 1 1 2 3 10 C4 14 11 14 16 12 Z"/>
            <path d="M16 12.5 C11 13 5 16 7 21 C9 24 14 20 16 14.5 Z"/>
          </g>
          <rect x="15.1" y="7" width="1.8" height="14" rx="0.9"/>
        </g>
        <path d="M15.5 7.5 C15 4 13.5 2.5 11.5 2 M16.5 7.5 C17 4 18.5 2.5 20.5 2" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
      </svg>
      <h1 class="wordmark" id="brand">Mariposa</h1>
    </div>
  </div>
</header>

<nav class="cats" aria-label="Categorías">
  <div class="belt" id="belt"><div class="track" id="chips" role="group" aria-label="Categorías"></div></div>
  <div class="subs" id="subs" hidden>
    <div class="wrap"><div class="sub-chips" id="subChips" role="group" aria-label="Subcategorías"></div></div>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="titlebar">
      <p class="lede" id="sub" hidden></p>
      <div class="search">
        <label class="sr" for="q">Buscar productos</label>
        <input id="q" type="search" placeholder="Buscar" autocomplete="off">
      </div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="skeleton" id="skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <ul class="grid" id="grid"></ul>
    <div class="state" id="state" hidden></div>
    <p class="empty" id="empty" hidden></p>
  </div>
</main>

<div class="cartbar" id="cartbar" hidden><div class="wrap"><button class="cartbar-btn" id="cartBtn" type="button" aria-haspopup="dialog"></button></div></div>

<footer class="note"><div class="wrap"><p id="note">Precios y existencias pueden cambiar sin previo aviso.</p></div></footer>

<noscript><p class="noscript">Esta página necesita JavaScript para mostrar el catálogo. Actívalo en tu navegador.</p></noscript>
<script src="config.js"></script>
<script src="js/guard.js"></script>
<script src="js/api.js"></script>
<script src="js/tienda.js"></script>
</body>
</html>
