  /* downscale a photo so it loads quickly on slow connections */
  function shrink(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth;
        var h = img.naturalHeight;
        var k = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(h * k));
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { if (b) resolve(b); else reject(new Error("blob")); }, "image/jpeg", quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("img")); };
      img.src = url;
    });
  }

  function saveErrorText(code) {
    if (code === "too_large") return "La página ya es demasiado grande. Quita algunos productos o fotos.";
    if (code === "rate_limited") return "Espera unos segundos e intenta guardar otra vez.";
    if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled" || code === "consent_required") return "Esta vista es solo de lectura: no tienes permiso para guardar.";
    return "No se pudo guardar. Revisa tu conexión e intenta otra vez.";
  }
  function save() {
    if (saving || !artifactApi || !canEdit) return;
    var next = normalize(draft);
    next.store.updated = todayText();
    var doc;
    try { doc = buildDoc(next); } catch (e) { saveError = "No se pudo preparar el guardado."; renderSave(); return; }
    saving = true;
    saveError = "";
    renderSave();
    // If another save lands first, this page reloads and the draft would be lost: keep a copy for that case.
    ssSet(K_STASH, JSON.stringify(next));
    ssSet(K_EDIT, "1");
    var slow = setTimeout(function () { $("saveMsg").textContent = "Está tardando más de lo normal…"; }, 15000);
    artifactApi.publish(doc).then(function () {
      clearTimeout(slow);
      saving = false;
      // This page reloads to the new version; if it does not, keep going with the saved data.
      pub = clone(next);
      pubJson = JSON.stringify(pub);
      draft = clone(next);
      saveError = "";
      renderAll();
      toast("Cambios guardados.");
      setTimeout(function () { ssDel(K_STASH); }, 3000);
    }, function (e) {
      clearTimeout(slow);
      saving = false;
      var code = e && e.code;
      if (code === "conflict") {
        saveError = "Alguien guardó cambios antes que tú. La página se va a actualizar y podrás recuperar tus cambios.";
      } else {
        ssDel(K_STASH);
        saveError = saveErrorText(code);
        if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled" || code === "consent_required") {

  /* A minimal .zip writer (no compression: photos are already compressed). */
  var CRC_TABLE = null;
  function crc32(u8) {
    if (!CRC_TABLE) {

    for (var i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

    var central = [];

    var cdSize = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name);
      var crc = crc32(f.data);
      var size = f.data.length;
      var local = new Uint8Array([].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate), u32(crc), u32(size), u32(size), u16(name.length), u16(0)));
      var cen = new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate), u32(crc), u32(size), u32(size), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)));

      cdSize += cen.length + name.length;
    });
    var end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cdSize), u32(offset), u16(0)));

  }

  /* Photos live in this artifact's storage; copy them out so the public page can keep them in a folder. */
  function photoViaCanvas(id) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement("canvas");
          c.width = img.naturalWidth;
          c.height = img.naturalHeight;
          c.getContext("2d").drawImage(img, 0, 0);
          c.toBlob(function (b) {
            if (!b) { resolve(null); return; }
            b.arrayBuffer().then(function (buf) { resolve(new Uint8Array(buf)); }, function () { resolve(null); });
          }, "image/jpeg", 0.88);
        } catch (e) { resolve(null); }
      };
      img.onerror = function () { resolve(null); };
      img.src = "/_blob/" + id;
    });
  }
  function fetchPhoto(id) {
    return fetch("/_blob/" + id).then(function (r) {
      if (!r.ok) throw new Error("http");
      return r.arrayBuffer();
    }).then(function (buf) {
      if (!buf || !buf.byteLength) throw new Error("empty");
      return new Uint8Array(buf);
    }).catch(function () { return photoViaCanvas(id); });
  }
  function humanSize(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  }

  // Builds the .zip from what is saved (not from unsaved drafts).
  function exportPublic(onStatus) {
    var state = normalize(pub);
    var ids = [];
    state.products.forEach(function (p) {
      if (/^[0-9a-f]{32}$/.test(p.img || "") && ids.indexOf(p.img) < 0) ids.push(p.img);
    });
    var got = {};
    var next = 0;
    var done = 0;
    function worker() {
      if (next >= ids.length) return Promise.resolve();
      var id = ids[next++];
      return fetchPhoto(id).then(function (bytes) {
        if (bytes && bytes.length) got[id] = bytes;
        done++;
        onStatus("Preparando fotos… " + done + " de " + ids.length);
      }).then(worker);
    }
    var pool = [];
    for (var i = 0; i < Math.min(4, ids.length); i++) pool.push(worker());
    return Promise.all(pool).then(function () {
      var missing = 0;
      state.products.forEach(function (p) {
        if (p.img && !got[p.img]) { delete p.img; missing++; }
      });
      var enc = new TextEncoder();
      var files = [{ name: "index.html", data: enc.encode(buildPublicDoc(state)) }];
      var base = siteBase(state);
      if (base) files.push({ name: "sitemap.xml", data: enc.encode(buildSitemap(base)) });
      Object.keys(got).forEach(function (id) { files.push({ name: "fotos/" + id + ".jpg", data: got[id] }); });
      var blob = makeZip(files);
      return { blob: blob, products: state.products.length, photos: Object.keys(got).length, missing: missing, sitemap: !!base };
    });
  }

      '<details class="guide" open><summary>Primera vez: subirla a internet (gratis)</summary><ol>' +
      '<li>Hazlo desde una computadora. Descomprime el archivo que descargaste (clic derecho, <b>Extraer todo</b>). Dentro hay <code>index.html</code> y la carpeta <code>fotos</code>.</li>' +
      '<li>Entra a <a href="https://github.com/signup" target="_blank" rel="noopener">github.com</a> y crea una cuenta gratis. Activa la verificación en dos pasos para que nadie más pueda cambiar tu página.</li>' +
      '<li>Toca <b>New repository</b>. Ponle un nombre sin espacios, por ejemplo <code>mariposa</code>, déjalo en <b>Public</b> y toca <b>Create repository</b>.</li>' +
      '<li>En el repositorio toca <b>uploading an existing file</b> (o <b>Add file</b>, <b>Upload files</b>). Arrastra <code>index.html</code>, la carpeta <code>fotos</code> y <code>sitemap.xml</code> (si viene) y toca <b>Commit changes</b>.</li>' +
      '<li>Ve a <b>Settings</b>, luego <b>Pages</b>. En <b>Source</b> elige <b>Deploy from a branch</b>; en <b>Branch</b> elige <b>main</b> con la carpeta <b>/ (root)</b> y toca <b>Save</b>.</li>' +
      '<li>Espera unos minutos y recarga esa pantalla: arriba aparece la dirección de tu página, algo como <code>https://tu-usuario.github.io/mariposa/</code>. Ábrela y revisa que todo se vea bien.</li>' +
      '</ol></details>' +
      '<details class="guide"><summary>Para aparecer en Google</summary><ol>' +
      '<li>Copia la dirección de tu página y pégala en <b>Datos de la tienda</b>, en <b>Dirección de tu página en internet</b>. Guarda los cambios, vuelve a descargar el archivo y súbelo otra vez (así se agregan el mapa del sitio y la imagen de vista previa).</li>' +
      '<li>Entra a <a href="https://search.google.com/search-console" target="_blank" rel="noopener">Google Search Console</a> con tu cuenta de Google. Elige <b>Prefijo de URL</b>, pega la dirección de tu página y, como método de verificación, elige <b>Etiqueta HTML</b>.</li>' +
      '<li>Google te muestra una etiqueta. Copia el código que está dentro de <code>content="…"</code> y pégalo en <b>Datos de la tienda</b>, en <b>Código de verificación de Google</b>. Guarda, descarga, sube otra vez y toca <b>Verificar</b> en Google.</li>' +
      '<li>En Search Console entra a <b>Sitemaps</b> y agrega <code>sitemap.xml</code>.</li>' +
      '<li>Google puede tardar de días a semanas en mostrar tu página. Para que te encuentren antes cuando busquen la tienda, crea también tu ficha en <a href="https://business.google.com" target="_blank" rel="noopener">Google Business Profile</a>.</li>' +
      '</ol></details>' +
      '<details class="guide last"><summary>Cada vez que cambies productos</summary><ol>' +
      '<li>Haz los cambios aquí y toca <b>Guardar cambios</b>.</li>' +
      '<li>Toca <b>Publicar en internet</b>, descarga el archivo y descomprímelo.</li>' +
      '<li>En tu repositorio de GitHub toca <b>Add file</b>, <b>Upload files</b>, arrastra de nuevo <code>index.html</code> y la carpeta <code>fotos</code> y toca <b>Commit changes</b>. Los cambios se ven en la página en unos minutos.</li>' +
      '</ol></details>';
    box.appendChild(guides);

    var actions = el("div", "actions");
    var close = el("button", "btn", "Cerrar");
    close.type = "button";
    close.addEventListener("click", closeModal);
    actions.appendChild(close);
    box.appendChild(actions);
    openModal("Publicar en internet", box);
  }

  /* ------------------------------ wiring ------------------------------ */
  $("editBtn").addEventListener("click", function () {
    editing = !editing;
    if (editing) ssSet(K_EDIT, "1"); else ssDel(K_EDIT);
    renderTopbar();
    renderGrid();
    renderAdmin();
  });
  $("btnAdd").addEventListener("click", function () { openProductForm(null); });
  $("btnCats").addEventListener("click", openCategoriesForm);
  $("btnStore").addEventListener("click", openStoreForm);
  $("btnPublish").addEventListener("click", openPublishForm);
  armConfirm($("btnExamples"), "Toca otra vez para quitarlos", function () {
    draft.products = draft.products.filter(function (p) { return !p.example; });
    afterChange("Productos de ejemplo quitados. Falta guardar los cambios.");
  });
  $("btnSave").addEventListener("click", save);
  armConfirm($("btnDiscard"), "Toca otra vez para descartar", function () {
    draft = clone(pub);
    saveError = "";
    renderAll();
    toast("Cambios descartados.");
  });
  $("btnRecover").addEventListener("click", function () {
    if (recoverable) { draft = normalize(recoverable); editing = true; }
    recoverable = null;
    ssDel(K_STASH);
    renderAll();
  });
  $("btnRecoverNo").addEventListener("click", function () {
    recoverable = null;
    ssDel(K_STASH);
    renderSave();
  });
  $("q").addEventListener("input", function (e) {
    view.q = e.target.value;
    renderGrid();
  });

  /* ---- category belt: slide it by hand; left alone it drifts by itself (about 36 px per second) ---- */
  var beltEl = $("belt");
  var beltMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  var drift = {
    gw: 0,          // width of one set of categories; the content repeats every gw pixels
    pos: 0,         // where the drift is (kept as a decimal, the browser rounds scrollLeft)
    expect: 0,      // the last position we set ourselves, to tell our own scrolling from the person's
    moving: false, last: 0,
    touched: -10000, // when the person last touched it: it drifts again 2.5 s after that
    down: false, hover: false, focus: false, drag: null, dragged: false
  };
  function setBeltPos(x) {
    drift.pos = x;
    drift.expect = x;
    drift.moving = false;
    beltEl.scrollLeft = x;
  }
  function touchBelt() { drift.touched = performance.now(); }
  function driftTick(t) {
    var dt = drift.last ? Math.min(t - drift.last, 64) : 16;
    drift.last = t;
    var calm = !drift.down && !drift.hover && !drift.focus && drift.gw > 0 && !beltMotion.matches && (t - drift.touched) > 2500;
    if (calm) {
      if (!drift.moving) {
        // Start from wherever the person left it, folded back into the middle copy (the content is identical there).
        var g = drift.gw;
        drift.pos = g + ((((beltEl.scrollLeft - g) % g) + g) % g);
        drift.moving = true;
      }
      drift.pos += dt * 0.036;
      if (drift.pos >= drift.gw * 2) drift.pos -= drift.gw;
      drift.expect = drift.pos;
      beltEl.scrollLeft = drift.pos;
    } else {
      drift.moving = false;
    }
    requestAnimationFrame(driftTick);
  }
  beltEl.addEventListener("scroll", function () {
    if (Math.abs(beltEl.scrollLeft - drift.expect) <= 1.5) return;   // that was us
    drift.moving = false;
    touchBelt();
  }, { passive: true });
  beltEl.addEventListener("wheel", function (e) { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) touchBelt(); }, { passive: true });
  beltEl.addEventListener("pointerdown", function (e) {
    drift.down = true;
    touchBelt();
    // Touch screens slide natively; with a mouse, dragging is done here.
    if (e.pointerType === "mouse" && e.button === 0) { drift.drag = { x: e.clientX, left: beltEl.scrollLeft }; drift.dragged = false; }
  });
  window.addEventListener("pointermove", function (e) {
    var d = drift.drag;
    if (!d) return;
    if (e.buttons === 0) { endPointer(); return; }
    var dx = e.clientX - d.x;
    if (!drift.dragged && Math.abs(dx) > 4) { drift.dragged = true; beltEl.classList.add("dragging"); }
    if (drift.dragged) { beltEl.scrollLeft = d.left - dx; touchBelt(); }
  });
  function endPointer() {
    if (!drift.down && !drift.drag) return;
    drift.down = false;
    drift.drag = null;
    touchBelt();
    if (drift.dragged) {
      beltEl.classList.remove("dragging");
      setTimeout(function () { drift.dragged = false; }, 0);   // after the click that follows a drag
    }
  }
  window.addEventListener("pointerup", endPointer);
  window.addEventListener("pointercancel", endPointer);
  // A drag with the mouse must not also select the category it ended on.
  beltEl.addEventListener("click", function (e) { if (drift.dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
  // With a mouse, hovering pauses it so a category is easy to click. A touch never leaves it paused.
  beltEl.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") drift.hover = true; });
  beltEl.addEventListener("pointerleave", function () { drift.hover = false; touchBelt(); });
  beltEl.addEventListener("focusin", function (e) {
    var fv = true;
    try { fv = e.target.matches(":focus-visible"); } catch (x) {}
    if (fv) { drift.focus = true; touchBelt(); }
  });
  beltEl.addEventListener("focusout", function () { drift.focus = false; touchBelt(); });

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (beltEl.clientWidth !== beltWidth) renderChips();
    }, 200);
  });

  /* ------------------------------- start ------------------------------- */
  renderAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderChips);
  if (window.requestAnimationFrame) requestAnimationFrame(driftTick);

  // A copy saved a moment ago: it is either what we just loaded (the save worked) or lost to a conflict.
  var stashRaw = ssGet(K_STASH);
  if (stashRaw) {
    try {
      var stashed = JSON.parse(stashRaw);
      if (JSON.stringify(normalize(stashed)) === pubJson) { ssDel(K_STASH); toast("Cambios guardados."); }
      else recoverable = stashed;
    } catch (e) { ssDel(K_STASH); }
  }

  // Editing tools appear only for people who can publish this page (the owner, or editors they invited).
  function initEditor() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    Promise.all([
      window.claude.use("user"),
      window.claude.use("artifact"),
      window.claude.use("assets"),
      window.claude.use("downloads")
    ]).then(function (r) {
      artifactApi = r[1];
      assetsApi = r[2];
      downloadsApi = r[3];
      if (!r[0] || !artifactApi) return false;
      return r[0].canEdit();
    }).then(function (ok) {
      canEdit = !!ok;
      if (canEdit && ssGet(K_EDIT) === "1") editing = true;
      if (!canEdit) { recoverable = null; ssDel(K_STASH); }
      renderAll();
    }).catch(function () {});
  }
  if (!IS_PUBLIC) initEditor();
})();
</script>
